services:
  reduct:
    build: .
    image: ghcr.io/its-the-vibe/reduct:latest
    pull_policy: always
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      CONFIG_FILE: /config.yaml
    volumes:
      - ./config.yaml:/config.yaml:ro
    restart: on-failure:10
